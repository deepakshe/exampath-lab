name: CI & Quality Assurance Gate

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Build, Audit & E2E Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Production Site
        run: npm run build

      - name: Run Build, Content & Link Quality Audit
        run: npm run validate

      - name: Run Cloudflare Workers Runtime & Header Tests
        run: npm run test:cf

      - name: Install Playwright Browsers & System Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Multi-Viewport E2E Tests
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright Test Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
